# Checks on every push and pull request: syntax of every script and the test suite.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "video/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax of every script
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Tests
        run: node --test test/run.js
      - name: Server starts in every OS mode
        run: |
          for m in linux darwin win32; do
            MIC_PLATFORM=$m PORT=4790 node server.js & pid=$!
            for i in $(seq 1 20); do curl -fs localhost:4790/api/app && break; sleep 0.5; done
            echo; curl -fs localhost:4790/api/deps > /dev/null && curl -fs localhost:4790/ | grep -q '<title>Mic Clean</title>'
            kill $pid; wait $pid 2>/dev/null || true
          done
