# Mic Clean — how electron-builder packages the desktop app (npm run dist:linux|mac|win).
# Release builds run in .github/workflows/release.yml.
appId: io.github.mohamedjs.micclean
productName: Mic Clean
copyright: Copyright © 2026 Mohamed Mahmoud
directories:
  output: dist
  buildResources: packaging
files:
  - package.json
  - server.js
  - electron/**
  - src/**
  - public/**
  - "!**/*.map"
asar: true
# The audio worklet and the RNNoise WASM are loaded by URL from the local server,
# which reads them from disk: keep public/ readable outside the asar archive.
asarUnpack:
  - public/**
extraResources:
  - from: packaging/licenses
    to: licenses
artifactName: "Mic-Clean-${version}-${os}-${arch}.${ext}"

linux:
  target: [deb, AppImage]
  category: AudioVideo
  icon: packaging/icons/icon.png
  executableName: mic-clean
  maintainer: mohamedjs <mohamedjs@users.noreply.github.com>
  syncDesktopName: true
  synopsis: Any mic, studio clean
  description: Double RNNoise, EQ, compressor and limiter as a virtual mic (PipeWire).
  extraResources:
    - from: packaging/linux/ladspa
      to: ladspa
  desktop:
    entry:
      Name: Mic Clean
      Comment: Clean up your microphone
      Keywords: microphone;noise;rnnoise;mic;audio;
deb:
  artifactName: "Mic-Clean-${version}-linux-amd64.${ext}"
  # electron's own libraries, plus PipeWire/pactl for the clean mic
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0,
            "pulseaudio-utils | pipewire-pulse", "pipewire-bin | pipewire"]
  recommends: [swh-plugins, libappindicator3-1]
appImage:
  artifactName: "Mic-Clean-${version}-linux-x86_64.${ext}"

mac:
  target: [dmg, zip]
  category: public.app-category.music
  icon: packaging/icons/icon.png
  # Not notarised (no Apple Developer ID yet): packaging/mac/adhoc-sign.js signs it
  # ad hoc so Apple Silicon opens it after "Open Anyway" instead of calling it damaged.
  identity: null
  hardenedRuntime: false
  artifactName: "Mic-Clean-${version}-macos-${arch}.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: Mic Clean listens to your microphone to clean it up and send it to BlackHole for your other apps.
    LSApplicationCategoryType: public.app-category.music
dmg:
  artifactName: "Mic-Clean-${version}-macos-${arch}.${ext}"
  title: Mic Clean
afterPack: packaging/mac/adhoc-sign.js

win:
  target: [nsis]
  icon: packaging/icons/icon.png
nsis:
  artifactName: "Mic-Clean-Setup-${version}-windows-${arch}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  shortcutName: Mic Clean
